<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<title>Gestão Coco Bambu</title>
<link rel="stylesheet" href="eventos.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <button class="back" onclick="location.href='index.html'">‹</button>
      <div class="logo logo-premium">CB</div>
      <div><h1>Eventos & Vendas</h1><p>Gestão Coco Bambu — vendas, contratos e calendário</p></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" title="Filtros" onclick="EVENTOS.toggleFilters()">🔎</button>
      <button class="icon-btn" title="Configurações" onclick="EVENTOS.toggleConfig()">⚙️</button>
      <button class="btn primary" onclick="EVENTOS.openForm()">+ Novo Evento</button>
    </div>
  </header>

  <main>
    <section class="hero hero-week">
      <div class="week-card">
        <div class="section-title-row">
          <div>
            <span class="eyebrow">Agenda comercial</span>
            <h2>Eventos fechados da semana</h2>
          </div>
          <span class="week-badge" id="weekRange">Semana atual</span>
        </div>
        <div class="week-scroll" id="weekEvents"></div>
      </div>
      <div class="hero-side">
        <div class="mini"><b id="heroTotal">R$ 0</b><span>Total estimado</span></div>
        <div class="mini"><b id="heroEventos">0</b><span>Eventos</span></div>
        <div class="mini"><b id="heroFechados">0</b><span>Fechados</span></div>
        <div class="mini"><b id="heroRecuperar">0</b><span>Recuperar</span></div>
      </div>
    </section>

    <nav class="tabs" id="tabs"></nav>

    <div class="filters" id="filtersPanel">
      <input class="field" id="q" placeholder="Buscar cliente, pacote, telefone ou observação...">
      <select class="field" id="ano"><option value="">Todos os anos</option><option>2026</option><option>2027</option></select>
      <select class="field" id="status"><option value="">Todos status</option></select>
      <select class="field" id="turno"><option value="">Todos turnos</option><option>Almoço</option><option>Jantar</option><option>Ambos</option><option>A definir</option></select>
      <select class="field" id="pacote"><option value="">Todos pacotes</option></select>
      <select class="field" id="mes"><option value="">Todos meses</option></select>
    </div>

    <section id="dashboard" class="section active"></section>
    <section id="funil" class="section"></section>
    <section id="calendario" class="section"></section>
    <section id="vendas" class="section"></section>
    <section id="recuperacao" class="section"></section>
    <section id="clientes" class="section"></section>
    <section id="pacotes" class="section"></section>
    <section id="sheets" class="section"></section>
  </main>

<div id="configPanel" class="sheet-panel" aria-hidden="true">
  <div class="sheet-card">
    <div class="sheet-head"><h3>Configurações</h3><button class="close mini-close" onclick="EVENTOS.toggleConfig(false)">×</button></div>
    <button class="menu-action" onclick="EVENTOS.exportCSV();EVENTOS.toggleConfig(false)">Exportar CSV</button>
    <button class="menu-action" onclick="EVENTOS.seedReset();EVENTOS.toggleConfig(false)">Recarregar planilha 2026/2027</button>
    <button class="menu-action" onclick="EVENTOS.showInstallHelp();EVENTOS.toggleConfig(false)">Instalar Gestão Coco Bambu</button>
    <button class="menu-action" onclick="EVENTOS.firebaseSync();EVENTOS.toggleConfig(false)">Sincronizar Firebase</button>
  </div>
</div>

<div id="installBanner" class="install-banner">
  <div><b>Instalar Gestão Coco Bambu</b><span>Abra como app em tela cheia no celular ou computador.</span></div>
  <button onclick="EVENTOS.installApp()">Instalar</button>
  <button class="install-close" onclick="EVENTOS.dismissInstall()">×</button>
</div>
</div>

<div id="modal" class="modal"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle">Evento</h2><button class="close" onclick="EVENTOS.closeModal()">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>

<script src="eventos-seed.js"></script>
<script src="eventos-firebase.js"></script>
<script src="eventos.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="gerenciador-tarefas.css?v=1">
<title>Gerenciador de Tarefas — Coco Bambu</title>
</head>
<body>
<div id="gtToast" class="gt-toast"></div>
<div class="gt-shell" id="gtShell">
  <aside class="gt-sidebar">
    <div class="gt-logo"><strong>COCO BAMBU</strong><small>GERENCIADOR DE TAREFAS</small></div>
    <button class="gt-create" onclick="GT.openWorkspaceModal()">+ Nova área de trabalho</button>
    <div class="gt-side-title">Áreas de trabalho</div>
    <div id="gtWorkspaces" class="gt-workspaces"></div>
    <div class="gt-side-foot">
      <button onclick="location.href='index.html'">‹ Voltar ao início</button>
      <small>Dados salvos no Firebase em módulo isolado.</small>
    </div>
  </aside>

  <main class="gt-main">
    <header class="gt-topbar">
      <div class="gt-brand">
        <button class="gt-mobile-menu" onclick="document.body.classList.toggle('gt-menu-open')">☰</button>
        <button class="gt-back" onclick="location.href='index.html'">‹</button>
        <div class="gt-mark">GT</div>
        <div><h1>Gerenciador de Tarefas</h1><p>Quadros, listas e cards no estilo Trello</p></div>
      </div>
      <div class="gt-actions">
        <button onclick="GT.openThemeModal()">🎨 Fundo</button>
        <button onclick="GT.openBoardModal()">+ Quadro</button>
        <button class="primary" onclick="GT.openColumnModal()">+ Lista</button>
      </div>
    </header>

    <section class="gt-hero">
      <div><span id="gtCurrentWorkspace">Área de trabalho</span><h2 id="gtCurrentBoard">Quadro</h2></div>
      <div class="gt-kpis">
        <div><b id="gtKpiBoards">0</b><small>Quadros</small></div>
        <div><b id="gtKpiColumns">0</b><small>Listas</small></div>
        <div><b id="gtKpiCards">0</b><small>Cards</small></div>
      </div>
    </section>

    <nav id="gtBoards" class="gt-board-tabs"></nav>
    <section id="gtBoard" class="gt-board"></section>
  </main>
</div>

<div id="gtModal" class="gt-modal" aria-hidden="true">
  <div class="gt-modal-card">
    <div class="gt-modal-head"><h3 id="gtModalTitle">Novo</h3><button onclick="GT.closeModal()">×</button></div>
    <div id="gtModalBody"></div>
  </div>
</div>

<div id="gtCardModal" class="gt-modal" aria-hidden="true">
  <div class="gt-modal-card gt-card-editor">
    <div class="gt-modal-head"><h3>Detalhes do card</h3><button onclick="GT.closeCardModal()">×</button></div>
    <div id="gtCardEditor"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="gerenciador-tarefas-firebase.js?v=1"></script>
<script src="gerenciador-tarefas.js?v=1"></script>
</body>
</html>
